name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - id: pages
        uses: actions/configure-pages@v4
      - run: npm ci
      - run: npm test
      - name: Build static export
        env:
          # Project Pages → "/hire-found"; empty when a custom domain is attached.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - name: Confirm static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          test -f out/index.html
          test -f out/jobs/index.html
          test -f out/yasmin/index.html
          test -f out/CNAME
          test "$(cat out/CNAME)" = "hirefound.com"
          if [ -n "$NEXT_PUBLIC_BASE_PATH" ]; then
            grep -F "${NEXT_PUBLIC_BASE_PATH}/_next/" out/index.html
            grep -F "${NEXT_PUBLIC_BASE_PATH}/assets/" out/index.html
            grep -F "${NEXT_PUBLIC_BASE_PATH}/assets/" out/yasmin/index.html
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
